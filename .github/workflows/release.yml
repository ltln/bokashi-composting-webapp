name: release

# Runs only when commits land on main (i.e. a PR was merged):
# build both images and push them to GHCR.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4

      # Skip cleanly until the app's Dockerfile exists (lands in milestone M0).
      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f "apps/${{ matrix.app }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/${{ matrix.app }}/Dockerfile not found, skipping publish"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.exists == 'true'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'true'

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bokashi-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
