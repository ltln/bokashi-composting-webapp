name: pr

# Build-only check on pull requests to main: verifies both apps and their
# Dockerfiles build. Nothing is pushed.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4

      # Skip cleanly until the app's Dockerfile exists (lands in milestone M0).
      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f "apps/${{ matrix.app }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/${{ matrix.app }}/Dockerfile not found, skipping build"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.exists == 'true'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'true'

      - name: Build image (no push)
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
