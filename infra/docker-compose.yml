# Local development database. Postgres only (no cache service; see docs/PLAN.md §3.3).
#   docker compose -f infra/docker-compose.yml up -d db
name: bokashi

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bokashi
      POSTGRES_PASSWORD: bokashi
      POSTGRES_DB: bokashi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bokashi -d bokashi"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
